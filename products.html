<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlineShopping - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-dot"></span>OnlineShopping</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="cart.html">Cart <span id="cart-count">(0)</span></a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="filter-bar">
            <h2>All Products</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="search-input" placeholder="Search products..." style="width: 220px;">
                <select id="category-filter" style="width: 170px;">
                    <option value="All">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Wearables">Wearables</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Lifestyle">Lifestyle</option>
                </select>
            </div>
        </div>

        <div id="product-grid" class="product-grid"></div>
    </main>

    <footer>&copy; 2026 OnlineShopping Portal</footer>
    <script src="script.js"></script>
</body>
</html>
